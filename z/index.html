<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toplu zikir · Vesile</title>
<!-- D1 (1.6): hatim davetiyle aynı altyapı. Önizleme görseli şimdilik hatimle ortak (h/og.jpg). -->
<meta name="description" content="Birlikte zikredelim — Vesile">
<meta property="og:title" content="Toplu zikre davetlisin 📿">
<meta property="og:description" content="Birlikte zikredelim — Vesile">
<meta property="og:image" content="https://vesileapp.github.io/h/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="apple-itunes-app" content="app-id=6799643752">
<link rel="icon" href="../icon.png">
<style>
  :root { --bg: #0f1411; --card: #f6f0e1; --ink: #1d2420; --dim: #5f675f; --gold: #c9a24b; --green: #1f7a55; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--ink); padding: 24px 16px;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Arabic", sans-serif;
  }
  main { width: 100%; max-width: 400px; background: var(--card); border-radius: 24px; padding: 28px 22px; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  .kicker { margin: 12px 0 2px; color: var(--dim); font-size: 14px; }
  h1 { margin: 0 0 6px; font-size: 24px; line-height: 1.3; word-wrap: break-word; }
  .ded { margin: 0 0 14px; color: var(--dim); font-style: italic; word-wrap: break-word; }
  .bar { height: 10px; border-radius: 6px; background: #e3dac4; overflow: hidden; margin: 14px 0 6px; }
  .bar i { display: block; height: 100%; background: var(--gold); width: 0; }
  .prog { font-size: 14px; color: var(--dim); margin: 0 0 18px; }
  .btn {
    display: block; width: 100%; margin-top: 12px; padding: 15px; border: 0; border-radius: 14px;
    background: var(--ink); color: #fff; text-decoration: none; font: inherit; font-weight: 700; cursor: pointer;
  }
  .btn.alt { background: transparent; color: var(--ink); border: 1.5px solid var(--ink); }
  .chip { display: inline-block; margin: 6px 0; padding: 3px 12px; border-radius: 99px; background: #e9dfc6; font-size: 13px; color: var(--dim); }
  .code { margin: 18px 0 0; font-size: 14px; color: var(--dim); }
  .code b { font-size: 20px; letter-spacing: 3px; color: var(--ink); }
  .toast { margin-top: 10px; font-size: 13px; color: var(--green); min-height: 18px; }
</style>
</head>
<body>
<main>
  <img src="../icon.png" alt="">
  <p class="kicker" id="kicker"></p>
  <span class="chip" id="chip" hidden></span>
  <h1 id="name">…</h1>
  <div class="bar" id="bar" hidden><i id="barFill"></i></div>
  <p class="prog" id="prog"></p>
  <a class="btn" id="open" href="#"></a>
  <a class="btn alt" id="get" href="#"></a>
</main>
<script>
(function () {
  var T = {"tr": {"kicker": "Toplu zikre davetlisin", "open": "Vesile'de aç ve katıl", "get": "Vesile'yi indir", "prog": "{p}/{t} · {r}. tur · {k} kişi katıldı", "missing": "Bu toplu zikir bulunamadı.", "loading": "Yükleniyor…"}, "ar": {"kicker": "أنت مدعو إلى ذكر جماعي", "open": "افتح Vesile وشارك", "get": "حمّل Vesile", "prog": "{p}/{t} · الجولة {r} · شارك {k} شخصًا", "missing": "لم يتم العثور على هذا الذكر الجماعي.", "loading": "جارٍ التحميل…"}, "en": {"kicker": "You're invited to a group dhikr", "open": "Open in Vesile & join", "get": "Get Vesile", "prog": "{p}/{t} · round {r} · {k} people joined", "missing": "This group dhikr wasn't found.", "loading": "Loading…"}};
  var X0 = {"tr": {"gd_tefriciye": "Salât-ı Tefrîciye", "gd_hasbunallah": "Hasbünallâhü ve ni'mel vekîl", "gd_ihlas": "İhlâs Sûresi", "gd_ayetelkursi": "Âyete'l-Kürsî", "gd_fatiha": "Fâtiha Sûresi", "gd_salavat": "Salavât-ı Şerîfe", "gd_tevhid": "Kelime-i Tevhîd", "gd_istigfar": "İstiğfâr", "gd_subhanallahi": "Sübhânallâhi ve bi-hamdihî", "gd_lahavle": "Lâ havle ve lâ kuvvete illâ billâh"}, "ar": {"gd_tefriciye": "الصلاة التفريجية", "gd_hasbunallah": "حسبنا الله ونعم الوكيل", "gd_ihlas": "سورة الإخلاص", "gd_ayetelkursi": "آية الكرسي", "gd_fatiha": "سورة الفاتحة", "gd_salavat": "الصلوات الشريفة", "gd_tevhid": "كلمة التوحيد", "gd_istigfar": "الاستغفار", "gd_subhanallahi": "سبحان الله وبحمده", "gd_lahavle": "لا حول ولا قوة إلا بالله"}, "en": {"gd_tefriciye": "Salat al-Tafrijiyya", "gd_hasbunallah": "Hasbunallahu wa ni'mal wakil", "gd_ihlas": "Surah Al-Ikhlas", "gd_ayetelkursi": "Ayat al-Kursi", "gd_fatiha": "Surah Al-Fatiha", "gd_salavat": "Salawat Sharifa", "gd_tevhid": "Kalima at-Tawhid", "gd_istigfar": "Istighfar", "gd_subhanallahi": "SubhanAllahi wa bihamdihi", "gd_lahavle": "La hawla wa la quwwata illa billah"}};
  var lang = (navigator.language || "en").slice(0, 2);
  var L = T[lang] || T.en, X = X0[lang] || X0.en;
  if (lang !== "tr") { document.documentElement.lang = T[lang] ? lang : "en"; if (lang === "ar") document.documentElement.dir = "rtl"; }
  function $(id) { return document.getElementById(id); }
  ["kicker", "open", "get"].forEach(function (k) { $(k).textContent = L[k]; });
  $("name").textContent = L.loading;
  var id = (new URLSearchParams(location.search).get("i") || "").trim();
  var ua = navigator.userAgent || "";
  var isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/.test(ua);
  var IOS_STORE = "https://apps.apple.com/app/id6799643752";
  // Android: Play'e kimlik "referrer" olarak gider → uygulama ilk açılışta kendiliğinden açar
  var PLAY = "https://play.google.com/store/apps/details?id=com.emrebarutcu.vesile&referrer=" + encodeURIComponent("z=" + id);
  // İndirme linki doğrulamadan önce: bozuk/yarım linkte de "Vesile'yi indir" mağazaya gider
  $("get").href = isAndroid ? PLAY : IOS_STORE;
  if (!/^[A-Za-z0-9_-]{1,64}$/.test(id)) { $("name").textContent = L.missing; $("open").hidden = true; return; }
  $("open").href = isAndroid
    ? "intent://z?i=" + encodeURIComponent(id) + "#Intent;scheme=vesile;package=com.emrebarutcu.vesile;S.browser_fallback_url=" + encodeURIComponent(PLAY) + ";end"
    : "vesile://z?i=" + encodeURIComponent(id);
  if (!isIOS && !isAndroid) $("open").hidden = true;
  fetch("https://ezanapp-backend-production.up.railway.app/v1/invite/zikir/" + encodeURIComponent(id))
    .then(function (r) { if (!r.ok) throw 0; return r.json(); })
    .then(function (g) {
      var name = (g.titleKey && X[g.titleKey]) || g.title; $("name").textContent = name; document.title = name + " · Vesile";
      $("bar").hidden = false; $("barFill").style.width = Math.round(g.progress / g.target * 100) + "%";
      $("prog").textContent = L.prog.replace("{p}", g.progress.toLocaleString()).replace("{t}", g.target.toLocaleString()).replace("{r}", g.round).replace("{k}", g.participants);
    })
    .catch(function () { $("name").textContent = L.missing; });
})();
</script>
</body>
</html>
